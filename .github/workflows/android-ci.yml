name: Android CI
on:
  push:
    branches: ["android/**", "feature/**"]
  pull_request:
    branches: ["android/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Verify pinned llama.cpp checkout
        run: git -C vendor/llama.cpp rev-parse HEAD
      - name: Assemble ARM64 debug APK and run unit tests
        run: gradle --no-daemon assembleDebug assembleRelease testDebugUnitTest
      - name: Live public API and model endpoint smoke checks
        run: python scripts/live_api_smoke.py
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: hamari-mehnat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
